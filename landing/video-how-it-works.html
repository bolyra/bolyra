<script type="text/babel">
// ═══════════════════════════════════════════════════════════════════════════
// animations.jsx
// ═══════════════════════════════════════════════════════════════════════════
// @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)

/* BEGIN USAGE */
// animations.jsx
// Reusable animation starter: Stage, Timeline, Sprite, easing helpers.
// Exports (to window): Stage, Sprite, PlaybackBar, TextSprite, ImageSprite, RectSprite,
//   useTime, useTimeline, useSprite, Easing, interpolate, animate, clamp.
//
// Usage (in an HTML file that loads React + Babel):
//
//   <Stage width={1280} height={720} duration={10} background="#f6f4ef">
//     <MyScene />
//   </Stage>
//
// <Stage> auto-scales to the viewport and provides the scrubber, play/pause,
// ←/→ seek, space, and 0-to-reset controls, and persists the playhead.
// Inside <Stage>, any child can call useTime() to read the current
// playhead (seconds). Or wrap content in <Sprite start={1} end={4}>...</Sprite>
// to only render during that window -- children receive a `localTime` and
// `progress` via the useSprite() hook. Use Easing + interpolate()/animate()
// for tweens; TextSprite / ImageSprite / RectSprite have built-in entry/exit.
// Build YOUR scenes by composing Sprites inside a Stage.
/* END USAGE */
// ─────────────────────────────────────────────────────────────────────────────

// ── Easing functions (hand-rolled, Popmotion-style) ─────────────────────────
// All easings take t ∈ [0,1] and return eased t ∈ [0,1] (may overshoot for back/elastic).
const Easing = {
  linear: (t) => t,

  // Quad
  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),

  // Cubic
  easeInCubic:    (t) => t * t * t,
  easeOutCubic:   (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),

  // Quart
  easeInQuart:    (t) => t * t * t * t,
  easeOutQuart:   (t) => 1 - (--t) * t * t * t,
  easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),

  // Expo
  easeInExpo:  (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
  easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeInOutExpo: (t) => {
    if (t === 0) return 0;
    if (t === 1) return 1;
    if (t < 0.5) return 0.5 * Math.pow(2, 20 * t - 10);
    return 1 - 0.5 * Math.pow(2, -20 * t + 10);
  },

  // Sine
  easeInSine:    (t) => 1 - Math.cos((t * Math.PI) / 2),
  easeOutSine:   (t) => Math.sin((t * Math.PI) / 2),
  easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,

  // Back (overshoot)
  easeOutBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  },
  easeInBack: (t) => {
    const c1 = 1.70158, c3 = c1 + 1;
    return c3 * t * t * t - c1 * t * t;
  },
  easeInOutBack: (t) => {
    const c1 = 1.70158, c2 = c1 * 1.525;
    return t < 0.5
      ? (Math.pow(2 * t, 2) * ((c2 + 1) * 2 * t - c2)) / 2
      : (Math.pow(2 * t - 2, 2) * ((c2 + 1) * (t * 2 - 2) + c2) + 2) / 2;
  },

  // Elastic
  easeOutElastic: (t) => {
    const c4 = (2 * Math.PI) / 3;
    if (t === 0) return 0;
    if (t === 1) return 1;
    return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
  },
};

// ── Core interpolation helpers ──────────────────────────────────────────────

// Clamp a value to [min, max]
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

// interpolate([0, 0.5, 1], [0, 100, 50], ease?) -> fn(t)
// Popmotion-style: linearly maps t across input keyframes to output values,
// with optional easing per segment (single fn or array of fns).
function interpolate(input, output, ease = Easing.linear) {
  return (t) => {
    if (t <= input[0]) return output[0];
    if (t >= input[input.length - 1]) return output[output.length - 1];
    for (let i = 0; i < input.length - 1; i++) {
      if (t >= input[i] && t <= input[i + 1]) {
        const span = input[i + 1] - input[i];
        const local = span === 0 ? 0 : (t - input[i]) / span;
        const easeFn = Array.isArray(ease) ? (ease[i] || Easing.linear) : ease;
        const eased = easeFn(local);
        return output[i] + (output[i + 1] - output[i]) * eased;
      }
    }
    return output[output.length - 1];
  };
}

// animate({from, to, start, end, ease})(t) — simpler single-segment tween.
// Returns `from` before `start`, `to` after `end`.
function animate({ from = 0, to = 1, start = 0, end = 1, ease = Easing.easeInOutCubic }) {
  return (t) => {
    if (t <= start) return from;
    if (t >= end) return to;
    const local = (t - start) / (end - start);
    return from + (to - from) * ease(local);
  };
}

// ── Timeline context ────────────────────────────────────────────────────────

const TimelineContext = React.createContext({ time: 0, duration: 10, playing: false });

const useTime = () => React.useContext(TimelineContext).time;
const useTimeline = () => React.useContext(TimelineContext);

// ── Sprite ──────────────────────────────────────────────────────────────────
// Renders children only when the playhead is inside [start, end]. Provides
// a sub-context with `localTime` (seconds since start) and `progress` (0..1).
//
//   <Sprite start={2} end={5}>
//     {({ localTime, progress }) => <Thing x={progress * 100} />}
//   </Sprite>
//
// Or as a plain wrapper — children can call useSprite() themselves.

const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });
const useSprite = () => React.useContext(SpriteContext);

function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {
  const { time } = useTimeline();
  const visible = time >= start && time <= end;
  if (!visible && !keepMounted) return null;

  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 && isFinite(duration)
    ? clamp(localTime / duration, 0, 1)
    : 0;

  const value = { localTime, progress, duration, visible };

  return (
    <SpriteContext.Provider value={value}>
      {typeof children === 'function' ? children(value) : children}
    </SpriteContext.Provider>
  );
}

// ── Sample sprite components ────────────────────────────────────────────────

// TextSprite: fades/slides text in on entry, holds, then fades out on exit.
// Props: text, x, y, size, color, font, entryDur, exitDur, align
function TextSprite({
  text,
  x = 0, y = 0,
  size = 48,
  color = '#111',
  font = 'Inter, system-ui, sans-serif',
  weight = 600,
  entryDur = 0.45,
  exitDur = 0.35,
  entryEase = Easing.easeOutBack,
  exitEase = Easing.easeInCubic,
  align = 'left',
  letterSpacing = '-0.01em',
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let ty = 0;

  if (localTime < entryDur) {
    const t = entryEase(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    ty = (1 - t) * 16;
  } else if (localTime > exitStart) {
    const t = exitEase(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    ty = -t * 8;
  }

  const translateX = align === 'center' ? '-50%' : align === 'right' ? '-100%' : '0';

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      transform: `translate(${translateX}, ${ty}px)`,
      opacity,
      fontFamily: font,
      fontSize: size,
      fontWeight: weight,
      color,
      letterSpacing,
      whiteSpace: 'pre',
      lineHeight: 1.1,
      willChange: 'transform, opacity',
    }}>
      {text}
    </div>
  );
}

// ImageSprite: scales + fades in; optional Ken Burns drift during hold.
function ImageSprite({
  src,
  x = 0, y = 0,
  width = 400, height = 300,
  entryDur = 0.6,
  exitDur = 0.4,
  kenBurns = false,
  kenBurnsScale = 1.08,
  radius = 12,
  fit = 'cover',
  placeholder = null, // {label: string} for striped placeholder
}) {
  const { localTime, duration } = useSprite();
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutCubic(clamp(localTime / entryDur, 0, 1));
    opacity = t;
    scale = 0.96 + 0.04 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInCubic(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = (kenBurns ? kenBurnsScale : 1) + 0.02 * t;
  } else if (kenBurns) {
    const holdSpan = exitStart - entryDur;
    const holdT = holdSpan > 0 ? (localTime - entryDur) / holdSpan : 0;
    scale = 1 + (kenBurnsScale - 1) * holdT;
  }

  const content = placeholder ? (
    <div style={{
      width: '100%', height: '100%',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      background: 'repeating-linear-gradient(135deg, #e9e6df 0 10px, #dcd8cf 10px 20px)',
      color: '#6b6458',
      fontFamily: 'JetBrains Mono, ui-monospace, monospace',
      fontSize: 13,
      letterSpacing: '0.04em',
      textTransform: 'uppercase',
    }}>
      {placeholder.label || 'image'}
    </div>
  ) : (
    <img src={src} alt="" style={{ width: '100%', height: '100%', objectFit: fit, display: 'block' }} />
  );

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      borderRadius: radius,
      overflow: 'hidden',
      willChange: 'transform, opacity',
    }}>
      {content}
    </div>
  );
}

// RectSprite: simple rectangle that animates position/size/color via props.
// Useful demo primitive — takes a `render` fn for per-frame customization.
function RectSprite({
  x = 0, y = 0,
  width = 100, height = 100,
  color = '#111',
  radius = 8,
  entryDur = 0.4,
  exitDur = 0.3,
  render, // optional: (ctx) => style overrides
}) {
  const spriteCtx = useSprite();
  const { localTime, duration } = spriteCtx;
  const exitStart = Math.max(0, duration - exitDur);

  let opacity = 1;
  let scale = 1;

  if (localTime < entryDur) {
    const t = Easing.easeOutBack(clamp(localTime / entryDur, 0, 1));
    opacity = clamp(localTime / entryDur, 0, 1);
    scale = 0.4 + 0.6 * t;
  } else if (localTime > exitStart) {
    const t = Easing.easeInQuad(clamp((localTime - exitStart) / exitDur, 0, 1));
    opacity = 1 - t;
    scale = 1 - 0.15 * t;
  }

  const overrides = render ? render(spriteCtx) : {};

  return (
    <div style={{
      position: 'absolute',
      left: x, top: y,
      width, height,
      background: color,
      borderRadius: radius,
      opacity,
      transform: `scale(${scale})`,
      transformOrigin: 'center',
      willChange: 'transform, opacity',
      ...overrides,
    }} />
  );
}


function Stage({
  width = 1280,
  height = 720,
  duration = 10,
  background = '#f6f4ef',
  fps = 60,
  loop = true,
  autoplay = true,
  persistKey = 'animstage',
  children,
}) {
  const [time, setTime] = React.useState(() => {
    try {
      const v = parseFloat(localStorage.getItem(persistKey + ':t') || '0');
      return isFinite(v) ? clamp(v, 0, duration) : 0;
    } catch { return 0; }
  });
  const [playing, setPlaying] = React.useState(autoplay);
  const [hoverTime, setHoverTime] = React.useState(null);
  const [scale, setScale] = React.useState(1);

  const stageRef = React.useRef(null);
  const canvasRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  // Persist playhead
  React.useEffect(() => {
    try { localStorage.setItem(persistKey + ':t', String(time)); } catch {}
  }, [time, persistKey]);

  // Auto-scale to fit viewport
  React.useEffect(() => {
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const barH = 44; // playback bar height
      const s = Math.min(
        el.clientWidth / width,
        (el.clientHeight - barH) / height
      );
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener('resize', measure);
    return () => {
      ro.disconnect();
      window.removeEventListener('resize', measure);
    };
  }, [width, height]);

  // Animation loop
  React.useEffect(() => {
    if (!playing) {
      lastTsRef.current = null;
      return;
    }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      setTime((t) => {
        let next = t + dt;
        if (next >= duration) {
          if (loop) next = next % duration;
          else { next = duration; setPlaying(false); }
        }
        return next;
      });
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      lastTsRef.current = null;
    };
  }, [playing, duration, loop]);

  // Keyboard: space = play/pause, ← → = seek
  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        setPlaying(p => !p);
      } else if (e.code === 'ArrowLeft') {
        setTime(t => clamp(t - (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.code === 'ArrowRight') {
        setTime(t => clamp(t + (e.shiftKey ? 1 : 0.1), 0, duration));
      } else if (e.key === '0' || e.code === 'Home') {
        setTime(0);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [duration]);

  const displayTime = hoverTime != null ? hoverTime : time;

  const ctxValue = React.useMemo(
    () => ({ time: displayTime, duration, playing, setTime, setPlaying }),
    [displayTime, duration, playing]
  );

  return (
    <div
      ref={stageRef}
      style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column',
        alignItems: 'center',
        background: '#0a0a0a',
        fontFamily: 'Inter, system-ui, sans-serif',
      }}
    >
      {/* Canvas area — vertically centered in remaining space */}
      <div style={{
        flex: 1,
        width: '100%',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        overflow: 'hidden',
        minHeight: 0,
      }}>
        <div
          ref={canvasRef}
          style={{
            width, height,
            background,
            position: 'relative',
            transform: `scale(${scale})`,
            transformOrigin: 'center',
            flexShrink: 0,
            boxShadow: '0 20px 60px rgba(0,0,0,0.4)',
            overflow: 'hidden',
          }}
        >
          <TimelineContext.Provider value={ctxValue}>
            {children}
          </TimelineContext.Provider>
        </div>
      </div>

      {/* Playback bar — stacked below canvas, never overlapping */}
      <PlaybackBar
        time={displayTime}
        actualTime={time}
        duration={duration}
        playing={playing}
        onPlayPause={() => setPlaying(p => !p)}
        onReset={() => { setTime(0); }}
        onSeek={(t) => setTime(t)}
        onHover={(t) => setHoverTime(t)}
      />
    </div>
  );
}

// ── Playback bar ────────────────────────────────────────────────────────────
// Play/pause, return-to-begin, scrub track, time display.
// Uses fixed-width time fields so layout doesn't thrash.

function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek, onHover }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);

  const timeFromEvent = React.useCallback((e) => {
    const rect = trackRef.current.getBoundingClientRect();
    const x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
    return x * duration;
  }, [duration]);

  const onTrackMove = (e) => {
    if (!trackRef.current) return;
    const t = timeFromEvent(e);
    if (dragging) {
      onSeek(t);
    } else {
      onHover(t);
    }
  };

  const onTrackLeave = () => {
    if (!dragging) onHover(null);
  };

  const onTrackDown = (e) => {
    setDragging(true);
    const t = timeFromEvent(e);
    onSeek(t);
    onHover(null);
  };

  React.useEffect(() => {
    if (!dragging) return;
    const onUp = () => setDragging(false);
    const onMove = (e) => {
      if (!trackRef.current) return;
      const t = timeFromEvent(e);
      onSeek(t);
    };
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mousemove', onMove);
    return () => {
      window.removeEventListener('mouseup', onUp);
      window.removeEventListener('mousemove', onMove);
    };
  }, [dragging, timeFromEvent, onSeek]);

  const pct = duration > 0 ? (time / duration) * 100 : 0;
  const fmt = (t) => {
    const total = Math.max(0, t);
    const m = Math.floor(total / 60);
    const s = Math.floor(total % 60);
    const cs = Math.floor((total * 100) % 100);
    return `${String(m).padStart(1, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
  };

  const mono = 'JetBrains Mono, ui-monospace, SFMono-Regular, monospace';

  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 12,
      padding: '8px 16px',
      background: 'rgba(20,20,20,0.92)',
      borderTop: '1px solid rgba(255,255,255,0.08)',
      width: '100%',
      maxWidth: 680,
      alignSelf: 'center',

      borderRadius: 8,
      color: '#f6f4ef',
      fontFamily: 'Inter, system-ui, sans-serif',
      userSelect: 'none',
      flexShrink: 0,
    }}>
      <IconButton onClick={onReset} title="Return to start (0)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        </svg>
      </IconButton>
      <IconButton onClick={onPlayPause} title="Play/pause (space)">
        {playing ? (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="3" y="2" width="3" height="10" fill="currentColor"/>
            <rect x="8" y="2" width="3" height="10" fill="currentColor"/>
          </svg>
        ) : (
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 2l9 5-9 5V2z" fill="currentColor"/>
          </svg>
        )}
      </IconButton>

      {/* Current time: fixed width so it doesn't thrash */}
      <div style={{
        fontFamily: mono,
        fontSize: 12,
        fontVariantNumeric: 'tabular-nums',
        width: 64, textAlign: 'right',
        color: '#f6f4ef',
      }}>
        {fmt(time)}
      </div>

      {/* Scrub track */}
      <div
        ref={trackRef}
        onMouseMove={onTrackMove}
        onMouseLeave={onTrackLeave}
        onMouseDown={onTrackDown}
        style={{
          flex: 1,
          height: 22,
          position: 'relative',
          cursor: 'pointer',
          display: 'flex', alignItems: 'center',
        }}
      >
        <div style={{
          position: 'absolute',
          left: 0, right: 0, height: 4,
          background: 'rgba(255,255,255,0.12)',
          borderRadius: 2,
        }}/>
        <div style={{
          position: 'absolute',
          left: 0, width: `${pct}%`, height: 4,
          background: 'oklch(72% 0.12 250)',
          borderRadius: 2,
        }}/>
        <div style={{
          position: 'absolute',
          left: `${pct}%`, top: '50%',
          width: 12, height: 12,

const C = {
  bg: '#0a0c10',
  ink: '#eef1f5',
  inkDim: 'rgba(238,241,245,0.56)',
  inkFaint: 'rgba(238,241,245,0.30)',
  inkGhost: 'rgba(238,241,245,0.12)',
  brand: 'oklch(72% 0.15 256)',
  brandSoft: 'oklch(72% 0.15 256 / 0.16)',
  brandLine: 'oklch(72% 0.15 256 / 0.5)',
  ok: 'oklch(78% 0.17 156)',
  okSoft: 'oklch(78% 0.17 156 / 0.16)',
  bad: 'oklch(67% 0.20 24)',
  badSoft: 'oklch(67% 0.20 24 / 0.16)',
  panel: 'rgba(255,255,255,0.035)',
  panelStrong: 'rgba(255,255,255,0.06)',
  border: 'rgba(255,255,255,0.10)',

const DISPLAY = "'Space Grotesk', system-ui, sans-serif";
const MONO = "'JetBrains Mono', ui-monospace, SFMono-Regular, monospace";

// fade helper: returns opacity 0..1 for a sprite-local time given fade in/out windows
function fadeAt(localTime, duration, fin = 0.4, fout = 0.4) {
  if (localTime < 0) return 0;
  if (localTime < fin) return clamp(localTime / fin, 0, 1);
  if (localTime > duration - fout) return clamp((duration - localTime) / fout, 0, 1);
  return 1;
}

// ── Ambient background: faint drifting grid + soft vignette + glow ───────────
function Backdrop({ glowX = 960, glowY = 540, glowColor = C.brand, glowStrength = 0.0 }) {
  const time = useTime();
  const drift = (time * 6) % 64;
  return (
    <div style={{ position: 'absolute', inset: 0, background: C.bg, overflow: 'hidden' }}>
      <div style={{
        position: 'absolute', inset: -64,
        backgroundImage: `linear-gradient(${C.inkGhost} 1px, transparent 1px), linear-gradient(90deg, ${C.inkGhost} 1px, transparent 1px)`,
        backgroundSize: '64px 64px',
        transform: `translate(${drift}px, ${drift * 0.5}px)`,
        opacity: 0.5,
        maskImage: 'radial-gradient(ellipse 75% 70% at 50% 50%, #000 55%, transparent 100%)',
        WebkitMaskImage: 'radial-gradient(ellipse 75% 70% at 50% 50%, #000 55%, transparent 100%)',
      }} />
      <div style={{
        position: 'absolute', inset: 0,
        background: `radial-gradient(circle 640px at ${glowX}px ${glowY}px, oklch(72% 0.15 256 / ${0.13 + glowStrength}), transparent 70%)`,
        opacity: 1,
      }} />
      <div style={{
        position: 'absolute', inset: 0,
        boxShadow: 'inset 0 0 320px rgba(0,0,0,0.7)',
      }} />
    </div>
  );
}

// ── Mono kicker label (eyebrow) ──────────────────────────────────────────────
function Kicker({ children, color = C.brand, style }) {
  return (
    <div style={{
      fontFamily: MONO, fontSize: 22, letterSpacing: '0.32em', whiteSpace: 'nowrap',
      textTransform: 'uppercase', color, fontWeight: 500, ...style,
    }}>{children}</div>
  );
}

// ── Lower-third caption ──────────────────────────────────────────────────────
function Caption({ t, dur, kicker, title, sub, x = 960, y = 880, align = 'center' }) {
  const o = fadeAt(t, dur, 0.5, 0.4);
  const rise = (1 - clamp(t / 0.6, 0, 1)) * 22;
  return (
    <div style={{
      position: 'absolute', left: x, top: y,
      transform: `translate(-50%, ${rise}px)`, opacity: o,
      textAlign: align, width: 1300,
      display: 'flex', flexDirection: 'column', gap: 14, alignItems: 'center',
    }}>
      {kicker && <Kicker>{kicker}</Kicker>}
      {title && <div style={{ fontFamily: DISPLAY, fontSize: 58, fontWeight: 600, color: C.ink, letterSpacing: '-0.02em', lineHeight: 1.05 }}>{title}</div>}
      {sub && <div style={{ fontFamily: MONO, fontSize: 26, color: C.inkDim, fontWeight: 400, letterSpacing: '0.01em' }}>{sub}</div>}
    </div>
  );
}

// ── Agent chip ───────────────────────────────────────────────────────────────
// state: 'idle' | 'rogue'
function AgentChip({ x, y, label, state = 'idle', appear = 1, dim = false }) {
  const rogue = state === 'rogue';
  const accent = rogue ? C.bad : C.brand;
  const s = 0.7 + 0.3 * appear;
  return (
    <div style={{
      position: 'absolute', left: x, top: y, transform: `translate(-50%,-50%) scale(${s})`,
      opacity: (dim ? 0.4 : 1) * appear,
      display: 'flex', alignItems: 'center', gap: 14,
      padding: '14px 20px 14px 16px',
      background: C.panel, border: `1px solid ${rogue ? C.badSoft : C.border}`,
      borderRadius: 14, width: 300, boxSizing: 'border-box',
      backdropFilter: 'blur(2px)',
    }}>
      <div style={{
        width: 40, height: 40, borderRadius: 10, flexShrink: 0,
        background: rogue ? C.badSoft : C.brandSoft,
        border: `1px solid ${accent.replace(')', ' / 0.5)')}`,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
      }}>
        <div style={{ width: 12, height: 12, borderRadius: 3, background: accent }} />
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 3, minWidth: 0 }}>
        <div style={{ fontFamily: MONO, fontSize: 19, color: C.ink, fontWeight: 500, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{label}</div>
        <div style={{ fontFamily: MONO, fontSize: 13, color: rogue ? C.bad : C.inkFaint, letterSpacing: '0.06em', textTransform: 'uppercase' }}>{rogue ? 'unverified' : 'agent'}</div>
      </div>
    </div>
  );
}

// ── MCP server node ──────────────────────────────────────────────────────────
function ServerNode({ x, y, appear = 1, guarded = false, breach = 0 }) {
  const tools = [
    { name: 'search()', risk: false },
    { name: 'fetch()', risk: false },
    { name: 'charge()', risk: true },
    { name: 'delete()', risk: true },
  ];
  const s = 0.85 + 0.15 * appear;
  return (
    <div style={{
      position: 'absolute', left: x, top: y, transform: `translate(-50%,-50%) scale(${s})`,
      opacity: appear, width: 320,
      background: C.panelStrong, border: `1px solid ${guarded ? C.brandLine : C.border}`,
      borderRadius: 18, overflow: 'hidden',
      boxShadow: guarded ? `0 0 0 1px ${C.brandSoft}, 0 24px 60px rgba(0,0,0,0.5)` : '0 24px 60px rgba(0,0,0,0.5)',
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', gap: 12, padding: '18px 22px',
        borderBottom: `1px solid ${C.border}`, background: 'rgba(255,255,255,0.025)',
      }}>
        <div style={{ width: 10, height: 10, borderRadius: 5, background: breach > 0.5 ? C.bad : (guarded ? C.ok : C.inkDim), boxShadow: `0 0 12px ${breach > 0.5 ? C.bad : (guarded ? C.ok : 'transparent')}` }} />
        <div style={{ fontFamily: MONO, fontSize: 19, color: C.ink, letterSpacing: '0.04em', fontWeight: 500 }}>MCP&nbsp;SERVER</div>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column' }}>
        {tools.map((tool, i) => (
          <div key={i} style={{
            display: 'flex', alignItems: 'center', justifyContent: 'space-between',
            padding: '15px 22px', borderBottom: i < tools.length - 1 ? `1px solid ${C.inkGhost}` : 'none',
          }}>
            <span style={{ fontFamily: MONO, fontSize: 20, color: tool.risk ? C.ink : C.inkDim, fontWeight: tool.risk ? 500 : 400 }}>{tool.name}</span>
            <span style={{ fontFamily: MONO, fontSize: 13, letterSpacing: '0.08em',
              color: guarded ? C.ok : (tool.risk ? C.bad : C.inkFaint) }}>
              {guarded ? 'GATED' : (tool.risk ? 'OPEN' : 'open')}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── The gateway gate ─────────────────────────────────────────────────────────
function Gate({ x, y, h = 560, appear = 1, pulse = 0 }) {
  const drop = (1 - appear) * -120;
  const glow = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(pulse * Math.PI * 2));
  return (
    <div style={{ position: 'absolute', left: x, top: y, transform: 'translate(-50%,-50%)', opacity: appear }}>
      {/* vertical beam */}
      <div style={{
        position: 'absolute', left: '50%', top: drop, transform: 'translate(-50%,-50%)',
        width: 8, height: h, borderRadius: 4,
        background: `linear-gradient(${C.brand}, ${C.brandLine})`,
        boxShadow: `0 0 ${18 + glow * 26}px ${C.brand.replace(')', ' / ' + (0.4 + glow * 0.4) + ')')}`,
      }} />
      {/* shield medallion */}
      <div style={{
        position: 'absolute', left: '50%', top: drop, transform: 'translate(-50%,-50%)',
        width: 110, height: 110, borderRadius: 26,
        background: C.bg, border: `2px solid ${C.brand}`,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        boxShadow: `0 0 ${20 + glow * 30}px ${C.brandSoft}, inset 0 0 30px ${C.brandSoft}`,
      }}>
        <ShieldGlyph color={C.brand} size={50} />
      </div>
    </div>
  );
}

function ShieldGlyph({ color = C.brand, size = 44 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
      <path d="M12 2.5 4.5 5.5v6c0 4.6 3.2 8.4 7.5 10 4.3-1.6 7.5-5.4 7.5-10v-6L12 2.5Z" stroke={color} strokeWidth="1.6" strokeLinejoin="round" fill={color.replace(')', ' / 0.12)')} />
      <path d="M8.6 12.2l2.4 2.4 4.4-4.6" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

// ── Data packet traveling horizontally ───────────────────────────────────────
function Packet({ x, y, label, color = C.brand, scale = 1, opacity = 1 }) {
  return (
    <div style={{
      position: 'absolute', left: x, top: y, transform: `translate(-50%,-50%) scale(${scale})`, opacity,
      display: 'flex', alignItems: 'center', gap: 9,
      padding: '8px 14px', borderRadius: 9,

    </div>
  );
}

// ── Stamp (VERIFIED / REJECTED) ──────────────────────────────────────────────
function Stamp({ x, y, kind = 'ok', appear = 1 }) {
  const ok = kind === 'ok';
  const color = ok ? C.ok : C.bad;
  const s = appear < 0.5 ? (1.6 - 1.2 * Easing.easeOutBack(clamp(appear / 0.5, 0, 1))) : 1;
  const rot = ok ? -8 : 7;
  return (
    <div style={{
      position: 'absolute', left: x, top: y,
      transform: `translate(-50%,-50%) rotate(${rot}deg) scale(${s})`,
      opacity: clamp(appear / 0.3, 0, 1),
      display: 'flex', alignItems: 'center', gap: 10,
      padding: '10px 20px', borderRadius: 12,
      background: ok ? C.okSoft : C.badSoft, border: `2px solid ${color}`,
    }}>
      {ok
        ? <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7" stroke={color} strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" /></svg>
        : <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke={color} strokeWidth="2.6" strokeLinecap="round" /></svg>}
      <span style={{ fontFamily: MONO, fontSize: 22, fontWeight: 600, letterSpacing: '0.1em', color }}>{ok ? 'VERIFIED' : 'REJECTED'}</span>
    </div>
  );
}

Object.assign(window, {
  C, DISPLAY, MONO, fadeAt,

});

// Phase model for the three requests. Local time t in [0, 20].
//   A: 1.0–7.5   B: 7.5–14.0   C: 14.0–20.0
const REQUESTS = [
  { start: 1.0, end: 7.5, method: 'GET', path: '/api/report', amount: '$25', mandate: '+ mandate', outcome: 'allow', status: '200', sub: 'an allow lets the payment flow proceed; nothing settles in this demo' },
  { start: 7.5, end: 14.0, method: 'GET', path: '/api/bulk-export', amount: '$500', mandate: 'same mandate', outcome: 'deny', status: '403', code: 'request_mismatch', title: 'Mandate Does Not Cover This Request', failRow: 4, sub: '$500 maps to tier medium; the signed set holds only small' },
  { start: 14.0, end: 20.0, method: 'GET', path: '/api/report', amount: '$25', mandate: 'no header', outcome: 'deny', status: '401', code: 'missing_authorization', title: 'Authorization Required', failRow: 0, sub: 'no 402 challenge is ever issued' },
];
const ROW_STEP = 0.26;
const ROWS_START = 1.0; // seconds after the request starts, after the packet arrives

function phaseFor(t) {
  for (const r of REQUESTS) {
    if (t >= r.start && t < r.end) return { r, local: t - r.start };
  }
  return null;
}

function rowStatesFor(r, local) {
  if (!r) return GATE_ROWS.map(() => 'idle');
  if (r.outcome === 'deny' && r.failRow === 0) return GATE_ROWS.map(() => 'idle'); // 401: gate-local, no check runs
  const n = GATE_ROWS.length;
  return GATE_ROWS.map((_, i) => {
    const at = ROWS_START + i * ROW_STEP;
    const failing = r.outcome === 'deny' && i + 1 === r.failRow;
    const beyond = r.outcome === 'deny' && i + 1 > r.failRow;
    if (local < at) return beyond && local >= ROWS_START + (r.failRow - 1) * ROW_STEP + 0.25 ? 'skip' : 'idle';
    if (failing) return local < at + 0.25 ? 'running' : 'fail';
    if (beyond) return 'skip';
    return local < at + 0.2 ? 'running' : 'pass';
  });
}

function verdictTime(r) {
  if (r.outcome === 'deny' && r.failRow === 0) return 1.3;
  const lastRow = r.outcome === 'allow' ? GATE_ROWS.length : r.failRow;
  return ROWS_START + (lastRow - 1) * ROW_STEP + 0.6;
}

function VerdictScene({ t, dur }) {
  const o = fadeAt(t, dur, 0.5, 0.5);
  const panelIn = clamp(t / 0.8, 0, 1);
  const agentIn = clamp((t - 0.3) / 0.6, 0, 1);
  const ph = phaseFor(t);
  const r = ph ? ph.r : null;
  const local = ph ? ph.local : 0;
  const rowStates = rowStatesFor(r, local);
  const reqIn = r ? clamp(local / 0.5, 0, 1) * (1 - clamp((local - (r.end - r.start) + 0.5) / 0.5, 0, 1)) : 0;
  // packet travels from the agent to the panel during the first second of each request
  const packetP = r ? clamp((local - 0.2) / 0.9, 0, 1) : 0;
  const packetX = interpolate([0, 1], [470, 880], Easing.easeInOutCubic)(packetP);
  const packetVisible = r && local > 0.2 && local < 1.15;
  const vt = r ? verdictTime(r) : 0;
  const verdictIn = r ? clamp((local - vt) / 0.5, 0, 1) : 0;
  const subIn = r ? clamp((local - vt - 0.6) / 0.5, 0, 1) : 0;
  return (
    <div style={{ position: 'absolute', inset: 0, opacity: o }}>
      <AgentChip x={330} y={470} label={HOW.agent} appear={agentIn} />
      {r && <RequestLine x={330} y={610} appear={reqIn} method={r.method} path={r.path} amount={r.amount} mandate={r.mandate} />}
      {packetVisible && <Packet x={packetX} y={470} label={r.mandate === 'no header' ? 'request' : 'request + mandate'} color={r.mandate === 'no header' ? C.bad : C.brand} />}
      <RelyingPartyPanel x={1300} y={600} appear={panelIn} rowStates={rowStates} />
      {r && r.outcome === 'allow' && verdictIn > 0 && (
        <React.Fragment>
          <VerdictStamp x={330} y={760} kind="allow" appear={verdictIn} />
          <div style={{ position: 'absolute', left: 330, top: 830, transform: 'translate(-50%,-50%)', opacity: verdictIn, padding: '6px 14px', borderRadius: 8, background: C.okSoft, border: `1px solid ${C.ok}` }}>
            <Mono size={20} color={C.ok} weight={600}>{r.status}</Mono>
          </div>
        </React.Fragment>
      )}
      {r && r.outcome === 'deny' && verdictIn > 0 && (
        <React.Fragment>
          <VerdictStamp x={330} y={740} kind="deny" appear={verdictIn} />
          <ProblemCard x={330} y={880} appear={verdictIn} status={r.status} code={r.code} title={r.title} />
        </React.Fragment>
      )}
      {r && subIn > 0 && (
        <div style={{ position: 'absolute', left: 330, top: r.outcome === 'allow' ? 920 : 985, transform: 'translate(-50%,-50%)', width: 520, textAlign: 'center', opacity: subIn, fontFamily: MONO, fontSize: 16, color: C.inkDim, lineHeight: 1.45 }}>
          {r.sub}
        </div>
      )}
    </div>
  );
}

      <HowCap start={5.6} end={15.8} kicker="1 · The mandate" title="One operator signature binds agent, audience, capability and expiry." sub="Altering the signed binding fails verification." />

      {/* honesty label from the first simulated output to the end */}
      <Sprite start={5.4} end={HOW_DURATION}>{({ localTime }) => <HonestyLabel appear={clamp(localTime / 0.6, 0, 1)} />}</Sprite>

      {/* S2 Verdict 16–36 */}
      <Sprite start={16} end={36.2}>{({ localTime }) => <VerdictScene t={localTime} dur={20.2} />}</Sprite>
      <HowCap start={16.6} end={35.8} kicker="2 · The verdict" title="Checked before any payment logic runs." sub="Over-scope and missing mandates fail closed. RFC 9457 problem details." />

      {/* S3 Receipts 36–46 */}
      <Sprite start={36} end={46.2}>{({ localTime }) => <ReceiptChainScene t={localTime} dur={10.2} />}</Sprite>
      <HowCap start={36.6} end={45.8} kicker="3 · The receipt" title="Every decision this gate makes, allow and deny, on one hash chain." sub="Verified with the public key; a known count detects a shortened chain." />

      {/* S4 Boundary 46–53 */}
      <Sprite start={46} end={53.2}>{({ localTime }) => <BoundaryScene t={localTime} dur={7.2} />}</Sprite>
      <HowCap start={46.6} end={52.8} kicker="Where it applies" title="Only where the relying party verifies." />

      {/* S5 CTA 53–58 */}
      <Sprite start={53} end={HOW_DURATION}>{({ localTime }) => <HowCTA t={localTime} dur={HOW_DURATION - 53} />}</Sprite>
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('video-root')).render(<HowVideo />);

</script>
</body>
</html>
