name: Bolyra CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# NOTE: Circuit compilation (circom) and contract tests (hardhat) are skipped
# in CI. Circuit compilation requires large Powers of Tau (.ptau) files and a
# circom binary that are impractical to install in GitHub Actions runners.
# Contract tests depend on compiled circuit artifacts (verifier contracts).
# Run these locally: `npm run test:circuits:fast` and `npm run test:contracts`.

jobs:
  sdk-tests:
    name: SDK — typecheck & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  openclaw-tests:
    name: OpenClaw integration — typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # The integration's package.json pins @bolyra/sdk ^0.3.0 for publish-
      # correctness, but during a release cohort the new SDK version isn't on
      # npm yet, so `npm ci` would fail at registry resolution. Rewrite the
      # dep to file:../../sdk in-CI, drop the stale lockfile, and install.
      # This mutation is local to the runner — the committed package.json
      # ships unchanged.
      - name: Build local @bolyra/sdk
        run: |
          cd sdk
          npm ci
          npm run build

      - name: Install integration with file:// SDK
        working-directory: integrations/openclaw
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.dependencies['@bolyra/sdk']='file:../../sdk';fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          rm -f package-lock.json
          npm install

      - run: npx tsc --noEmit
        working-directory: integrations/openclaw
      - run: npm test
        working-directory: integrations/openclaw

  mcp-tests:
    name: MCP integration — typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Build local @bolyra/sdk
        run: cd sdk && npm ci && npm run build

      - name: Build local @bolyra/receipts
        run: cd integrations/receipts && npm install && npm run build

      - name: Install MCP integration with file:// SDK + receipts
        working-directory: integrations/mcp
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.dependencies['@bolyra/sdk']='file:../../sdk';p.dependencies['@bolyra/receipts']='file:../receipts';fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          rm -f package-lock.json
          npm install

      - run: npx tsc --noEmit
        working-directory: integrations/mcp
      - run: npm test -- --testPathIgnorePatterns='e2e'
        working-directory: integrations/mcp

  gateway-tests:
    name: Gateway — typecheck & test (source integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # The gateway's jest config maps @bolyra/sdk and @bolyra/mcp to sibling
      # SOURCE and @bolyra/receipts to its built dist, so this job is the one
      # place gateway + mcp + receipts are exercised together from the tree.
      # (The verified-actions demo runs against PUBLISHED packages on purpose
      # and does not cover source changes here.)
      - name: Build local @bolyra/sdk
        run: cd sdk && npm ci && npm run build

      - name: Build local @bolyra/receipts
        run: cd integrations/receipts && npm install && npm run build

      - name: Build local @bolyra/mcp with file:// SDK + receipts
        working-directory: integrations/mcp
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.dependencies['@bolyra/sdk']='file:../../sdk';p.dependencies['@bolyra/receipts']='file:../receipts';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          rm -f package-lock.json
          npm install
          npm run build

      - name: Install gateway with file:// SDK + receipts + mcp
        working-directory: integrations/gateway
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.dependencies['@bolyra/sdk']='file:../../sdk';p.dependencies['@bolyra/receipts']='file:../receipts';p.dependencies['@bolyra/mcp']='file:../mcp';fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
          rm -f package-lock.json
          npm install

      - run: npx tsc --noEmit
        working-directory: integrations/gateway
      - run: npx jest --ci
        working-directory: integrations/gateway

  mpp-payments-tests:
    name: MPP gate — typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # Registry pins only: no sibling file: deps; the committed lockfile is
      # authoritative (never file: links).
      - run: npm ci
        working-directory: integrations/mpp-payments
      - run: npx tsc --noEmit
        working-directory: integrations/mpp-payments
      - run: npm run typecheck:integration
        working-directory: integrations/mpp-payments
      - run: npx jest --ci
        working-directory: integrations/mpp-payments
      - run: npm run test:integration
        if: always()
        working-directory: integrations/mpp-payments

  hosted-verify-tests:
    name: Hosted verify — typecheck, test (workers pool) & boot smoke
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          # wrangler 4.124 (lockfile pin) requires Node >= 22; smoke-test already uses 22.
          node-version: 22

      # @cloudflare/vitest-pool-workers runs workerd locally; no Cloudflare
      # credentials are needed. Registry pins only. `npm run typecheck` runs
      # `wrangler types` first: the Cloudflare runtime globals live in the
      # generated, gitignored worker-configuration.d.ts (baseline finding).
      - run: npm ci
        working-directory: integrations/hosted-verify
      - run: npm run typecheck
        working-directory: integrations/hosted-verify
      - run: npx vitest run
        working-directory: integrations/hosted-verify
      # E10: the binding digest (and so every credential id) is implemented twice, here and
      # in @bolyra/mpp; the vitest fixtures pin only this Worker's side. Re-derive the
      # committed digests and capability map from the INSTALLED package (plain Node: the
      # workers pool cannot load it) so a drift fails CI instead of denying every real
      # registration as "not registered".
      - name: Installed @bolyra/mpp agrees on the binding digest and capability map
        working-directory: integrations/hosted-verify
        run: npm run test:agreement
      # The workers pool does not enforce workerd's entry-module rules: on 2026-09-20 main
      # was undeployable across two merged PRs (src/index.ts exported a plain constant and
      # workerd refused the module) while the suite ran green. So boot the real Worker
      # under `wrangler dev` (fresh state dir, placeholder tenant) and prove 401 without
      # auth, deny untrusted_root/credential_not_active before registration, and 201 then
      # allow with the same credential id after it.
      - name: Boot the Worker under wrangler dev and smoke it
        working-directory: integrations/hosted-verify
        timeout-minutes: 5
        run: npm run smoke:dev
      # The provisioning script and its validator must stay runnable on a plain Linux
      # shell (no keychain here): syntax, both mjs modules parse, the usage path, the
      # empty-map guard in tenants-put.mjs (it must refuse without starting wrangler),
      # an empty registry, and the validator CLI on the documented dev example. The
      # stand-in below prints wrangler's own success line because tenants-put.mjs
      # reports success only when it has seen one.
      - name: Provisioning script and validator
        working-directory: integrations/hosted-verify
        run: |
          bash -n pilot/tenant.sh
          node --check pilot/tenants-assemble.mjs
          node --check pilot/tenants-put.mjs
          bash pilot/tenant.sh >/dev/null 2>&1 && exit 1 || test $? -eq 2
          printf '' | node pilot/tenants-put.mjs --env=ci && exit 1 || test $? -eq 1
          d="$(mktemp -d)"; printf '#!/bin/sh\necho "SANITIZE=$WRANGLER_LOG_SANITIZE WRITE_LOGS=$WRANGLER_WRITE_LOGS LOG=$WRANGLER_LOG"\necho "Success! Uploaded secret TENANTS"\n' > "$d/npx"; chmod +x "$d/npx"
          printf '{"acme":{}}' | PATH="$d:$PATH" WRANGLER_LOG_SANITIZE=false WRANGLER_WRITE_LOGS=true WRANGLER_LOG=none node pilot/tenants-put.mjs --env=ci | grep -qx 'SANITIZE=true WRITE_LOGS=false LOG=log'
          TENANTS_DIR="$(mktemp -d)" bash pilot/tenant.sh show
          sed -n 's/^TENANTS=//p' .dev.vars.example | node pilot/tenants-check.mjs
          printf '{}' | node pilot/tenants-check.mjs && exit 1 || test $? -eq 1
          bash -n pilot/tenant-lock-check.sh
          bash pilot/tenant-lock-check.sh

  payment-protocols-tests:
    name: Payment Protocols — typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Build local @bolyra/sdk
        run: cd sdk && npm ci && npm run build

      - name: Install payment-protocols with file:// SDK
        working-directory: integrations/payment-protocols
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.dependencies['@bolyra/sdk']='file:../../sdk';fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          rm -f package-lock.json
          npm install

      - run: npx tsc --noEmit
        working-directory: integrations/payment-protocols
      - run: npm test
        working-directory: integrations/payment-protocols

  cli-tests:
    name: CLI — typecheck & test (external verifier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Build local @bolyra/sdk
        run: cd sdk && npm ci && npm run build

      - name: Install CLI with file:// SDK
        working-directory: integrations/cli
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.dependencies['@bolyra/sdk']='file:../../sdk';fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          rm -f package-lock.json
          npm install

      # `typecheck` is deliberate over a bare `tsc --noEmit`: its pretypecheck
      # hook builds the @bolyra/receipts and @bolyra/mpp dists that this
      # package's tsconfig `paths` resolve against.
      - name: Typecheck
        working-directory: integrations/cli
        run: npm run typecheck

      # The real-proof tests generate genuine Groth16 proofs, which needs
      # circuit artifacts. CI has no Circom toolchain and circuits/build is
      # gitignored, so pull the prebuilt artifacts from @bolyra/circuits and
      # reshape them into the circuits/build layout the SDK + CLI expect.
      - name: Materialize circuit artifacts from @bolyra/circuits
        working-directory: integrations/cli
        run: |
          npm install --no-save --no-audit --no-fund @bolyra/circuits@0.1.0
          node scripts/circuits-build-from-package.js "$RUNNER_TEMP/circuits-build"

      # The 24-case e2e matrix spawns the BUILT CLI (`node dist/main.js`), and
      # `typecheck` is --noEmit, so dist/ must be produced explicitly.
      - name: Build
        working-directory: integrations/cli
        run: npm run build

      - name: Test
        working-directory: integrations/cli
        env:
          BOLYRA_CIRCUITS_DIR: ${{ runner.temp }}/circuits-build
        run: npm test

      # The dist/ built above is exactly the reference-CLI fallback the
      # verifier_envelope class targets — run the domain-agnostic verifier
      # wire-envelope vectors against it per push.
      - name: verifier_envelope vectors — built reference CLI
        run: node spec/conformance-runner.js --type verifier_envelope

      # Negative control (§7.1 exit/code consistency): a verifier answering
      # deny code=internal_error at exit 0 must fail EVERY envelope vector.
      # Guards the runner check that keeps deny-only vectors from passing it.
      - name: verifier_envelope negative control — internal_error at exit 0
        run: |
          if VERIFIER_CMD='printf %s "{\"verdict\":\"deny\",\"code\":\"internal_error\",\"message\":\"x\"}"' node spec/conformance-runner.js --type verifier_envelope; then
            echo "negative control unexpectedly passed" >&2; exit 1
          fi

  lockfiles:
    name: Lockfiles — clean npm ci per manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # Every other job installs with `npm install` (often after rewriting
      # @bolyra/sdk to a file: path), which tolerates an incomplete lockfile.
      # This job is the only one that proves a consumer could reproducibly
      # install what we committed. See issue #93.
      - name: Verify every committed lockfile installs with npm ci
        run: bash scripts/verify-lockfiles.sh

  conformance:
    name: Conformance test vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: circuits/package-lock.json

      # The conformance runner imports circomlibjs from circuits/node_modules
      - name: Install circuit dependencies (no compile)
        run: cd circuits && npm ci

      # receipt_binding vectors use the reference @bolyra/receipts build
      # (npm ci runs its prepare/tsc). Without this they SKIP instead of RUN.
      - name: Build reference receipts (receipt_binding vectors)
        run: cd integrations/receipts && npm ci

      - run: node spec/conformance-runner.js

  evc-conformance:
    name: EVC conformance — package sync & both reference hosts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # replay.js --check does `git show <suite.commit>:spec/test-vectors.json`
          # at historical pins, which needs full history.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # The published @bolyra/evc-conformance suite is dependency-free: bin.js
      # runs the vendored 30 host_behavior vectors against the vendored JS
      # reference host, and sync.js --check fails if any vendored file drifts
      # from spec/ (the corpus draft-kondoju-evc cites publicly).
      - name: Package suite + spec-sync drift check
        working-directory: integrations/evc-conformance
        run: npm test

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            spec/reference-host-rs/target
          key: evc-rs-host-${{ runner.os }}-${{ hashFiles('spec/reference-host-rs/Cargo.lock', 'spec/reference-host-rs/src/**') }}

      - name: Build Rust reference host
        run: cargo build --release --locked --manifest-path spec/reference-host-rs/Cargo.toml

      - name: host_behavior vectors — Rust reference host
        run: node spec/conformance-runner.js --type host_behavior --host "spec/reference-host-rs/target/release/evc-reference-host"

      # Offline harness tests only — the live interop replay (network,
      # third-party code) is the separate interop-replay dispatch workflow.
      - name: Interop replay harness + dispatch building blocks — offline tests
        run: node --test interop/replay.test.js interop/submission-overlay.test.js interop/harness-integrity.test.js

      # Registry + suite-pin validation without executing anything (the live
      # replay is the separate interop-replay dispatch workflow).
      - name: Interop registry — offline pin check
        run: node interop/replay.js --check

      # landing/conformance.html is generated from interop/claims.json and
      # committed; any drift between them is a CI failure.
      - name: Conformance page — generator tests + drift check
        run: |
          node --test landing/gen-conformance.test.js
          node landing/gen-conformance.js --check

  typecheck-all:
    name: Typecheck — all TypeScript packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Typecheck sdk
        run: cd sdk && npm ci && npx tsc --noEmit

      - name: Typecheck integrations/openclaw
        run: |
          cd sdk && npm run build
          cd ../integrations/openclaw
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.dependencies['@bolyra/sdk']='file:../../sdk';fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          rm -f package-lock.json
          npm install
          npx tsc --noEmit

      - name: Build local @bolyra/receipts (for MCP typecheck)
        run: cd integrations/receipts && npm install && npm run build

      - name: Typecheck integrations/mcp
        run: |
          cd integrations/mcp
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.dependencies['@bolyra/sdk']='file:../../sdk';p.dependencies['@bolyra/receipts']='file:../receipts';fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          rm -f package-lock.json
          npm install
          npx tsc --noEmit

      - name: Typecheck integrations/payment-protocols
        run: |
          cd integrations/payment-protocols
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.dependencies['@bolyra/sdk']='file:../../sdk';fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          rm -f package-lock.json
          npm install
          npx tsc --noEmit

      # Registry pins, no file: rewrite.
      - name: Typecheck integrations/mpp-payments
        run: cd integrations/mpp-payments && npm ci && npx tsc --noEmit

      # hosted-verify needs Node 22 (wrangler) and generated runtime types. This setup-node
      # is sticky for later steps: keep the hosted-verify typecheck LAST in this job.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Typecheck integrations/hosted-verify
        env:
          WRANGLER_SEND_METRICS: "false"
        run: cd integrations/hosted-verify && npm ci && npm run typecheck

  dependency-audit:
    name: Dependency audit — runtime deps only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # Audit each published package's runtime dependencies. We use
      # --omit=dev so we only gate on advisories reachable from shipped code;
      # dev-only advisories (Hardhat toolchain, circom_tester, etc.) are
      # tracked separately in SECURITY.md "Known accepted residual Dependabot
      # alerts". --audit-level=high means low/moderate are reported but do
      # not fail the build; high and critical fail.
      #
      # Every package resolves its LOCAL @bolyra/* siblings via file: rewrites
      # (not just @bolyra/sdk — cli/gateway/ai also depend on mcp/receipts) so
      # the audit gates the tree a consumer would get from THIS commit, and
      # --package-lock-only means no build artifacts are needed on disk.
      # Covers all 13 packages (12 published + the operated hosted-verify).
      - name: Audit all packages (runtime deps)
        run: |
          set -euo pipefail
          export BOLYRA_REPO_ROOT="$PWD"
          for dir in \
            sdk \
            integrations/receipts \
            delegation \
            circuits-package \
            integrations/mcp \
            integrations/openclaw \
            integrations/payment-protocols \
            integrations/cli \
            integrations/gateway \
            integrations/ai \
            integrations/shield \
            integrations/mpp-payments \
            integrations/hosted-verify
          do
            echo "::group::Audit $dir"
            (
              cd "$dir"
              node -e '
                const fs = require("fs"), path = require("path");
                const local = {
                  "@bolyra/sdk": "sdk",
                  "@bolyra/receipts": "integrations/receipts",
                  "@bolyra/delegation": "delegation",
                  "@bolyra/circuits": "circuits-package",
                  "@bolyra/mcp": "integrations/mcp",
                  "@bolyra/openclaw": "integrations/openclaw",
                  "@bolyra/payment-protocols": "integrations/payment-protocols",
                  "@bolyra/cli": "integrations/cli",
                  "@bolyra/gateway": "integrations/gateway",
                  "@bolyra/ai": "integrations/ai",
                  "@bolyra/shield": "integrations/shield",
                  "@bolyra/mpp": "integrations/mpp-payments",
                };
                const root = process.env.BOLYRA_REPO_ROOT;
                const p = JSON.parse(fs.readFileSync("package.json"));
                for (const name of Object.keys(p.dependencies || {})) {
                  if (local[name]) {
                    p.dependencies[name] =
                      "file:" + path.relative(process.cwd(), path.join(root, local[name]));
                  }
                }
                fs.writeFileSync("package.json", JSON.stringify(p, null, 2));
              '
              rm -f package-lock.json
              # --ignore-scripts: file:-linked siblings (and the package itself)
              # may declare prepare/build hooks (e.g. receipts' `prepare: tsc`)
              # that cannot run without node_modules — the audit only needs
              # dependency resolution, never lifecycle scripts.
              npm install --package-lock-only --ignore-scripts
              npm audit --omit=dev --audit-level=high
            )
            echo "::endgroup::"
          done

  smoke-test:
    name: Smoke test — fresh install from npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Create temp project and install from npm
        run: |
          mkdir /tmp/bolyra-smoke
          cd /tmp/bolyra-smoke
          npm init -y
          npm install @bolyra/sdk @bolyra/receipts

      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/smoke-test.cjs
          path: repo

      - name: Run smoke test
        working-directory: /tmp/bolyra-smoke
        run: |
          cp $GITHUB_WORKSPACE/repo/.github/smoke-test.cjs ./smoke-test.cjs
          node smoke-test.cjs

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Python SDK smoke test
        run: |
          pip install bolyra
          python3 -c "
          from bolyra.types import HumanIdentity, AgentCredential, Permission
          from bolyra.identity import permissions_to_bitmask, validate_cumulative_bit_encoding
          bitmask = permissions_to_bitmask([Permission.READ_DATA, Permission.WRITE_DATA])
          validate_cumulative_bit_encoding(bitmask)
          print(f'✓ Python SDK: bitmask={bitmask}, types import OK')
          "

  verified-actions-demo:
    name: Verified-actions demo — README path from a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # The demo is what the operator emails promise. It depends on the
      # PUBLISHED @bolyra packages, so this proves the README's two commands
      # work with nothing else in the repo built. The demo exits non-zero if
      # any scene verdict, receipt-tamper check, or chain check comes out wrong.
      - name: Install, run the demo, re-verify the audit log, run its tests
        working-directory: examples/verified-actions-demo
        run: |
          npm ci --no-audit --no-fund
          npm run demo
          npm run verify
          npm test

  operator-trial:
    name: Operator trial — dry run and tests from a clean checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # The trial is what the operator entry page promises. It depends on the
      # PUBLISHED @bolyra packages, so this proves the README path works with
      # nothing else in the repo built. The dry run exits non-zero if any
      # attempt verdict, dispatch count, or chain check comes out wrong.
      - name: Install, dry-run the trial, run its tests
        working-directory: examples/operator-trial
        run: |
          npm ci --no-audit --no-fund
          npm run trial -- --dry-run
          npm test

  managed-revocation-example:
    name: Managed revocation example — register, spend, revoke, deny against wrangler dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          # wrangler 4.124 (hosted-verify's lockfile pin) requires Node >= 22.
          node-version: 22

      # The example is the revocation demonstration: it registers an operator-signed
      # mandate with the in-repo hosted verifier, spends under it through the PUBLISHED
      # @bolyra/mpp gate, revokes it, and proves the next fresh presentation is denied
      # before the paid action runs. The Worker is the one thing built from the repo
      # (it is not published); its .dev.vars is generated from documented placeholders
      # and never printed. The example exits non-zero if any check comes out wrong.
      - name: Install the hosted verifier and the example
        run: |
          (cd integrations/hosted-verify && npm ci --no-audit --no-fund)
          (cd examples/managed-revocation && npm ci --no-audit --no-fund)

      - name: Run the example against wrangler dev, then its tests
        working-directory: examples/managed-revocation
        run: |
          npm run demo:local
          npm test
