name: Hosted verify — production health probe

on:
  # GitHub scheduling is best effort — a run can slip past the 15-minute mark.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      url:
        description: 'override the probed URL for a controlled failure test; leave empty for production'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: hosted-verify-health
  cancel-in-progress: false

jobs:
  probe:
    name: Probe /health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe production /health
        env:
          INPUT_URL: ${{ inputs.url }}
          CONFIGURED_URL: ${{ vars.HOSTED_VERIFY_HEALTH_URL }}
        run: |
          set -euo pipefail

          # HOSTED_VERIFY_HEALTH_URL (and the dispatch override) is a repository variable, not a
          # secret, and is echoed/logged as plain text below — it must never be set to a value that
          # carries a credential (e.g. a query-string token).
          URL="${INPUT_URL}"
          if [ -z "$URL" ]; then
            URL="${CONFIGURED_URL}"
          fi
          if [ -z "$URL" ]; then
            echo "::error::HOSTED_VERIFY_HEALTH_URL repository variable is not set"
            exit 1
          fi

          # One-line diagnostic of a /health body: closed enums (anything else prints "other";
          # a missing field prints "absent") and the version id (only when id-shaped). Never
          # fails the step itself.
          diag() {
            [ -s body.json ] || return 0
            if ! jq -e -s . body.json > /dev/null 2>&1; then
              echo "diagnostic: body is not JSON"
              return 0
            fi
            jq -r -s '
              def enum($allowed): if . == null then "absent" elif (. as $v | $allowed | index([$v])) then . else "other" end;
              if length == 1 and (.[0] | type) == "object" then
                .[0]
                | "diagnostic: status=\(.status | enum(["ok", "degraded"]))"
                  + " tenants=\(.tenants | enum(["ok", "invalid"]))"
                  + " capability_map=\(.capability_map | enum(["ok", "invalid"]))"
                  + " registry=\(.registry | enum(["ok", "unavailable", "timeout"]))"
                  + " registry_kind=\(.registry_kind | enum(["durable-object"]))"
                  + " version_id=\((.version.id? // null) | if . == null then "absent" elif type == "string" and test("^[A-Za-z0-9-]{1,64}$") then . else "other" end)"
              else
                "diagnostic: body is not a single JSON object"
              end
            ' body.json 2>/dev/null || true
          }

          set +e
          code=$(curl -sS --fail-with-body --max-time 20 --retry 2 --retry-delay 5 -o body.json -w '%{http_code}' "$URL")
          curl_status=$?
          set -e
          if [ "$curl_status" -ne 0 ]; then
            # A degraded Worker answers 503, which --fail-with-body turns into curl exit 22: the
            # body is still saved, so say why.
            echo "::error::health probe: request failed (curl exit $curl_status, HTTP $code)"
            diag
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::health probe: HTTP $code"
            diag
            exit 1
          fi

          # Strict since 2026-09-24 (production version 07a5a031 emits registry and capability_map).
          # The HTTP 200 gate above already requires tenants, capability_map and registry all "ok";
          # these clauses guard that computation drifting.
          if ! jq -e -s '
            length == 1
            and (.[0] | type) == "object"
            and .[0].status == "ok"
            and .[0].tenants == "ok"
            and .[0].registry_enforced == true
            and .[0].registry == "ok"
            and .[0].capability_map == "ok"
          ' body.json > /dev/null; then
            echo "::error::health probe: assertions failed"
            jq -r -s '
              if length == 1 and (.[0] | type) == "object" then
                "single_object=true"
                + " status_ok=\(.[0].status == "ok")"
                + " tenants_ok=\(.[0].tenants == "ok")"
                + " registry_enforced=\(.[0].registry_enforced == true)"
                + " registry_ok=\(.[0].registry == "ok")"
                + " capability_map_ok=\(.[0].capability_map == "ok")"
              else
                "single_object=false"
              end
            ' body.json
            exit 1
          fi

          echo "health ok: status=ok tenants=ok capability_map=ok registry=ok registry_enforced=true"
